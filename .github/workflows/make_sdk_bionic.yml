name: Make SDK (Bionic)
run-name: Make SDK ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Platform Tools Version (release tag)"
        required: true
        default: "37.0.0"
      tag:
        description: "Android Source Tag"
        required: true
        default: "android-17.0.0_r1"
      ndk_version:
        description: "Official NDK version for the bionic clang"
        required: true
        default: "30"
      ndk_revision:
        description: "Official NDK revision letter (optional)"
        required: false
        default: ""
      release_suffix:
        description: "Suffix for the release tag, e.g. 16c880a (default: short commit sha)"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-sdk.yml
    secrets: inherit
    with:
      platform: bionic
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      ndk_version: ${{ inputs.ndk_version }}
      ndk_revision: ${{ inputs.ndk_revision }}
      # Empty => the reusable workflow tags the release with the short commit
      # sha (<version>+<sha>), so a fixed build never overwrites the old tag.
      release_suffix: ${{ inputs.release_suffix }}
      # arm64 only: the device that needs this build is aarch64, and one
      # target keeps the bionic matrix (the long pole) short.
      targets: '["aarch64-linux-android"]'
