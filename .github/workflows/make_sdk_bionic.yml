name: Make SDK (Bionic)
run-name: Make SDK ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "AOSP source tag (android-* or platform-tools-*)"
        required: true
        default: "android-17.0.0_r1"
      ndk_version:
        description: "Official NDK version for the bionic clang"
        required: true
        default: "30"
      ndk_revision:
        description: "Official NDK revision letter (optional)"
        required: false
        default: ""
      only:
        description: "Only these targets (JSON array), default all"
        required: false
        type: string
      release_suffix:
        description: "Suffix for the release tag, e.g. 16c880a (default: short commit sha)"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-sdk.yml
    secrets: inherit
    with:
      platform: bionic
      tag: ${{ inputs.tag }}
      ndk_version: ${{ inputs.ndk_version }}
      ndk_revision: ${{ inputs.ndk_revision }}
      only: ${{ inputs.only }}
      # Empty => the reusable workflow tags the release with the short commit
      # sha (<version>+<sha>), so a fixed build never overwrites the old tag.
      release_suffix: ${{ inputs.release_suffix }}
      # riscv64-linux-android
      targets: '["aarch64-linux-android", "armv7a-linux-androideabi", "i686-linux-android", "x86_64-linux-android"]'
