name: Make SDK (reusable)
on:
  workflow_call:
    inputs:
      platform:
        description: "linux | bionic | macos | windows | bsd"
        required: true
        type: string
      targets:
        description: "JSON array of target triples"
        required: true
        type: string
      version:
        description: "Platform Tools Version (release tag)"
        required: true
        type: string
      tag:
        description: "Android Source Tag"
        required: true
        type: string
      build_tools_version:
        description: "sdkmanager build-tools package"
        required: false
        type: string
        default: "37.0.0"
      ndk_version:
        description: "Official NDK version for the bionic clang (bionic only)"
        required: false
        type: string
        default: ""
      ndk_revision:
        description: "Official NDK revision letter (bionic only)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /mnt

      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          sudo rsync -aqP /var/lib/docker/ /mnt/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - name: Prepare /mnt/build
        run: |
          sudo mkdir -p /mnt/build
          sudo chown $(id -u):$(id -g) /mnt/build
          rmdir "$GITHUB_WORKSPACE"
          ln -s /mnt/build "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5

      # --- caches: the dev loop rebuilds the same tree over and over, so the
      # expensive, input-stable work (NDK download, compiled objects) is worth
      # keeping between runs. Keys cover the inputs that actually change the
      # content; a changed key just means a cold build.
      - name: Cache official NDK
        if: inputs.platform == 'bionic'
        uses: actions/cache@v4
        with:
          path: /mnt/build/android-ndk-r${{ inputs.ndk_version }}${{ inputs.ndk_revision }}
          key: ndk-r${{ inputs.ndk_version }}${{ inputs.ndk_revision }}-${{ runner.os }}-${{ runner.arch }}

      # No AOSP source cache (measured 2026-10-15): xz-ing the multi-GB tree
      # cost ~10 min per run to replace a ~4 min clone, and the save never
      # succeeded anyway -- the runner ran out of disk and the job died on
      # "No space left on device". Cloning is cheaper and safe; a patched tree
      # could never be cached regardless (patch-source.sh is not idempotent).

      # ccache: rolling key + restore-keys prefix so every run reuses the
      # previous objects and only recompiles what changed.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /mnt/build/.ccache
          key: ccache-${{ inputs.platform }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.platform }}-${{ matrix.target }}-

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make SDK
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sdk-builder:latest"
          docker run --rm \
            -v "/mnt/build:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            -e CCACHE_DIR=/work/.ccache \
            -e PLATFORM='${{ inputs.platform }}' \
            -e TARGET='${{ matrix.target }}' \
            -e TAG='${{ inputs.tag }}' \
            -e BUILD_TOOLS_VERSION='${{ inputs.build_tools_version }}' \
            -e NDK_VERSION='${{ inputs.ndk_version }}' \
            -e NDK_REVISION='${{ inputs.ndk_revision }}' \
            -e ROOTDIR=/work \
            "$IMAGE" \
            bash -c 'scripts/fetch-source.sh && scripts/build.sh && scripts/make-sdk.sh'

      - name: Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: "${{ inputs.version }}"
          artifacts: ${{ github.workspace }}/android-sdk-${{ matrix.target }}.${{ inputs.platform == 'windows' && '7z' || 'tar.xz' }}
          allowUpdates: true
          replacesArtifacts: true
          body: ''
